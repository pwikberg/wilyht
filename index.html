<title>Koulu</title>
<style>
  :root { --bg:#f3f5fb; --card:#fff; --ink:#1d2433; --muted:#6b7487; --accent:#2f6fde; --err:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11151d; --card:#1b212c; --ink:#e9edf5; --muted:#9aa3b5; --accent:#6d9cff; --err:#ff8a80; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  form { background:var(--card); padding:26px 22px; border-radius:20px; width:min(340px,88vw); box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { margin:0 0 4px; font-size:24px; }
  p { margin:0 0 16px; color:var(--muted); font-size:15px; }
  input[type=password] { width:100%; box-sizing:border-box; font-size:18px; padding:12px; border-radius:12px; border:1px solid #c9cfdb; background:transparent; color:inherit; }
  label { display:flex; gap:8px; align-items:center; margin:12px 0 16px; font-size:15px; }
  button { width:100%; font-size:18px; padding:12px; border:0; border-radius:12px; background:var(--accent); color:#fff; }
  .err { color:var(--err); min-height:1.4em; margin:10px 0 0; font-size:15px; }
</style>

  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  var f = document.getElementById("f"), err = document.getElementById("err"), btn = document.getElementById("btn");
  function ask() { f.hidden = false; document.getElementById("pw").focus(); }
  f.addEventListener("submit", function (e) {
